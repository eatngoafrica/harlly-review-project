name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Make sure .env is not committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error file=.env::.env contains secrets and must not be committed"
            exit 1
          fi

      - name: Syntax check
        run: python -m py_compile harlyy_export.py

      - name: Lint (undefined names, unused imports, syntax errors)
        run: |
          pip install ruff
          ruff check --select E9,F --target-version py39 --output-format github harlyy_export.py

      - name: Smoke test (CLI parses, no network)
        run: python harlyy_export.py --help
